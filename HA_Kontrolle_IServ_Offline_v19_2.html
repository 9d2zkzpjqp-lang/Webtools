.problem-legend-p{font-size:9px;padding-left:1px;vertical-align:super}

.statuschoices .statusbtn[data-value="problem"].active{background:#d6f3e4;border-color:#13805c;color:#096244}
.statuschoices .statusbtn[data-value="excused"].active{background:#fff1c7;border-color:#ddb85c;color:#78540a}
.pill.excused{background:#fff1c7;color:#78540a}
table.matrix .taskcell.excused{background:#fff2d8;color:#976809}
@media print{table.matrix.dense-matrix .taskcell.excused{background:#fff0c9!important;color:#8b6600!important}table.matrix.dense-matrix .problem-mark{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#cff0df!important;color:#096848!important}}
/* Reine Problemmeldung: eigenständiger, nicht als Abgabe gezählter Status. */
.problem-mark.problem-pending{color:#815500;background:#ffe2a1}
.statuschoices .statusbtn[data-value="problem_only"]{color:#805800;border-color:#e0c588}
.statuschoices .statusbtn[data-value="problem_only"].active{background:#fff0c9;border-color:#c18a1d;color:#805800}
@media print{table.matrix.dense-matrix .problem-mark.problem-pending{background:#ffe2a1!important;color:#815500!important}}

/* v18: Elternhinweis-Zähler und echter Gesamtfehlzähler bewusst trennen. */
table.matrix.dense-matrix th.countercol,table.matrix.dense-matrix td.countercol{min-width:66px;width:66px;max-width:66px;right:75px}
table.matrix.dense-matrix th.totalcol,table.matrix.dense-matrix td.totalcol{position:sticky;right:0;z-index:2;min-width:75px;width:75px;max-width:75px;padding:0 3px;background:#f1f4f8}
table.matrix.dense-matrix thead th.countercol,table.matrix.dense-matrix thead th.totalcol{position:sticky!important;z-index:4;background:#172f4d;color:#fff;font-size:9px;line-height:1.08;white-space:normal}
table.matrix.dense-matrix .counter-headline{display:block}
table.matrix.dense-matrix tbody tr:nth-child(even) td.totalcol{background:#eaf0f6}
table.matrix.dense-matrix tbody tr.flagged td.totalcol{background:#fff3f4}
table.matrix.dense-matrix .totalcount{display:inline-block;min-width:22px;padding:1px 5px;border:1px solid #d6e0ea;border-radius:5px;font-size:11px;font-weight:750;line-height:1.3;color:#425973;background:#fff}
@media(max-width:550px){table.matrix.dense-matrix th.countercol,table.matrix.dense-matrix td.countercol{min-width:62px;width:62px;max-width:62px}}
@media print{
 table.matrix.dense-matrix th.countercol,table.matrix.dense-matrix td.countercol{position:static!important;right:auto!important;min-width:34px;width:43px;max-width:43px}
 table.matrix.dense-matrix th.totalcol,table.matrix.dense-matrix td.totalcol{position:static!important;right:auto!important;min-width:38px;width:47px;max-width:47px}
 table.matrix.dense-matrix thead th.countercol,table.matrix.dense-matrix thead th.totalcol{position:static!important;background:#172f4d!important;color:#fff!important;font-size:8px}
 table.matrix.dense-matrix tbody tr:nth-child(even) td.totalcol{background:#eaf0f6!important}
 table.matrix.dense-matrix .totalcount{background:#fff!important;color:#344f6b!important;border-color:#d6e0ea!important;font-size:9px}
}
.waivemodal .modalfoot{flex-wrap:wrap}

/* v19.2 – prominentes Aufgabenthema, erreichbare Tabellenköpfe, Schülernavigation */
.review-headline{align-items:center;gap:12px 20px;margin-bottom:6px}
.review-task-summary{flex:1 1 360px;min-width:0}
.review-task-eyebrow{font-size:11px;line-height:1.35;font-weight:720;color:#506987;letter-spacing:.015em;margin-bottom:3px}
.review-headline .review-task-title{font-size:clamp(18px,1.55vw,22px);line-height:1.22;color:#172f4d;letter-spacing:-.32px;font-weight:760;overflow-wrap:anywhere}
.review-task-subtitle{color:#6b7a8f;font-size:11.5px;margin-top:4px}
.review-head-actions{flex:0 1 480px;min-width:240px;display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:nowrap}
.review-head-actions select{flex:1 1 270px;min-width:160px;max-width:420px;width:100%;overflow:hidden;text-overflow:ellipsis;font-size:12px;min-height:35px;padding:6px 8px}
.review-head-actions .btn{flex-shrink:0}
.matrix-task-jump{display:flex;align-items:center;justify-content:center;width:100%;min-width:0;height:100%;min-height:30px;border:0;border-radius:0;color:inherit;background:transparent;font:inherit;font-weight:750;font-size:inherit;cursor:pointer;padding:0 2px}
.matrix-task-jump:hover{background:#2b4a71;color:#fff}
.matrix-task-jump:focus-visible{outline:2px solid #e5c46e;outline-offset:-3px;background:#315782}
.modalhead>div:first-child{flex:1;min-width:0}
.modalhead h2{overflow-wrap:anywhere}
.modal-nav-controls{display:flex;align-items:center;gap:5px;flex-shrink:0}
.modal-nav-controls .modal-nav-btn{width:36px;height:36px;min-height:36px;min-width:36px;padding:0;border-radius:8px;border:1px solid #d4deeb;background:#f4f7fb;color:#23527e;font-size:19px;font-weight:700;display:grid;place-items:center}
.modal-nav-controls .modal-nav-btn:disabled{background:#f8f9fa;color:#aeb9c5;border-color:#e7ebef;opacity:.7}
.modal-nav-controls .modal-nav-btn:hover:not(:disabled){background:#e6f0fd}
.modal-nav-controls .modal-close-btn{min-height:36px;width:36px;min-width:36px;padding:0}
.modal-nav-position{font-size:11px;color:#6a7c90;white-space:nowrap;min-width:31px;text-align:center;font-weight:650}
@media(max-width:950px){.review-headline{align-items:stretch}.review-task-summary{flex-basis:100%}.review-head-actions{flex:1 1 100%;justify-content:flex-start;min-width:0}.review-head-actions select{max-width:none}}
@media(max-width:510px){.review-headline .review-task-title{font-size:18px}.review-head-actions{gap:6px}.review-head-actions .btn{font-size:11px;padding:6px 8px}.review-head-actions select{min-width:0;font-size:12px}.modalhead{padding:13px 12px;gap:8px}.modalhead h2{font-size:18px;line-height:1.2}.modalhead small{display:block;line-height:1.25;margin-top:3px}.modal-nav-controls{gap:3px}.modal-nav-position{display:none}.modal-nav-controls .modal-nav-btn,.modal-nav-controls .modal-close-btn{height:34px;width:34px;min-height:34px;min-width:34px}}
@media print{.matrix-task-jump{color:inherit!important;background:transparent!important}.modal-nav-controls{display:none!important}}

function updateSaveHint(){let el=$('#saveHint');if(!el)return;let pending=(!state.exportedAt||state.updatedAt>state.exportedAt);el.className='savehint'+(pending||!localSaveOk?' warn':'');el.textContent=!localSaveOk?'⚠ Lokale Speicherung fehlgeschlagen':pending?'● Lokal gespeichert · JSON-Export offen':'✓ Lokal gespeichert · JSON: '+formatDate(state.exportedAt);el.title='Nur dieser Browser. Mac und iPad synchronisieren sich NICHT automatisch. '+(state.exportedAt?'Letzter JSON-Export: '+formatDate(state.exportedAt):'Noch kein JSON-Export.');const ds=$('#desktopSaveHint');if(ds){ds.textContent=!localSaveOk?'⚠ Speicherfehler':pending?'● JSON offen':'✓ JSON gesichert';ds.className='desktop-savehint'+(pending||!localSaveOk?' warn':'');ds.title=el.title;}}

// Keine Serien: Es zählen ALLE fehlenden Aufgaben seit dem letzten Zählerabschluss.
// Ein Zählerabschluss kann eine tatsächlich versandte Elternnachricht oder ein bewusstes Zurücksetzen ohne Nachricht sein.
// Bestehende Einträge ohne kind gelten weiterhin als tatsächlich versandte Benachrichtigungen.
function taskKey(t){return t.term*100000+t.number;}
function notificationState(c,s){
 const history=s.notifications||[],last=history[history.length-1];
 const cutoff=last?Number(last.throughKey)||0:0;

}
function confirmNotice(c,s){

 if(!confirm(`Elternbenachrichtigung für ${s.name} wurde tatsächlich versandt?\n\nOffene fehlende Hausaufgaben: ${labels}\n\nDanach beginnt die Zählung für künftige Aufgaben wieder bei 0.`))return;

 s.notifications=s.notifications||[];
 s.notifications.push({kind:'sent',sentAt:now(),throughKey:taskKey(latest),taskIds:current.missing.map(t=>t.id),taskLabels:current.missing.map(t=>`HJ ${t.term} #${t.number}`)});

}

async function copyText(value,button){let ok=false;try{await navigator.clipboard.writeText(value);ok=true;}catch(e){const textArea=document.createElement('textarea');textArea.value=value;textArea.style.position='fixed';textArea.style.opacity='0';document.body.append(textArea);textArea.select();ok=document.execCommand('copy');textArea.remove();}if(!ok){alert('Kopieren nicht möglich. Bitte den Text markieren und manuell kopieren.');return;}if(button&&button.isConnected){const original=button.textContent;button.textContent='✓ Kopiert';button.classList.add('copy-done');setTimeout(()=>{if(button.isConnected){button.textContent=original;button.classList.remove('copy-done');}},1600);}else alert('Kopiert.');}
function downloadBlob(data,name,mime){let blob=data instanceof Blob?data:new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}

async function launchDeviceShare(){const d=deviceExport;if(!d)return;
 let file=d.file;
 const supported=f=>typeof navigator.share==='function'&&typeof navigator.canShare==='function'&&navigator.canShare({files:[f]});
 if(!supported(file)&&file.name.toLowerCase().endsWith('.json')){
  // iOS accepts text/plain on more versions than application/json; filename stays *.json.
  const alt=new File([file],file.name,{type:'text/plain'});
  if(supported(alt))file=alt;
 }
 if(!supported(file)){d.phase='unsupported';drawDeviceExport();return;}
 try{
  // Must run directly inside the real click event; do not await anything before it.
  await navigator.share({files:[file]});
  if(deviceExport!==d)return;
  d.phase='confirm';drawDeviceExport();
 }catch(e){if(deviceExport!==d)return;
  if(e?.name==='AbortError'){deviceExport=null;drawDeviceExport();return;}
  console.warn('Teilen nicht möglich',e);d.phase='error';drawDeviceExport();
 }
}
function deliverExport(data,name,mime,{jsonStamp=null,prepared=false}={}){
 const blob=data instanceof Blob?data:new Blob([data],{type:mime});
 if(!isAppleTouchDevice()){
  downloadBlob(blob,name,mime);confirmJSONExport(jsonStamp);return;
 }
 const file=new File([blob],name,{type:mime});
 deviceExport={file,jsonStamp,phase:prepared?'ready':'sharing'};
 if(prepared)drawDeviceExport();else launchDeviceShare();
}

function exportJSON(){
 const exportDate=new Date(),stamp=exportDate.toISOString();
 // Use local time in the checkpoint filename, not the UTC timestamp from toISOString().
 const two=n=>String(n).padStart(2,'0');
 const localDate=[exportDate.getFullYear(),two(exportDate.getMonth()+1),two(exportDate.getDate())].join('-');
 const localTime=[two(exportDate.getHours()),two(exportDate.getMinutes()),two(exportDate.getSeconds())].join('');
 const filename=`HA-Kontrolle_Alle-Klassen_${localDate}_${localTime}.json`;

 const contents=JSON.stringify({...state,appId:'hausaufgabenkontrolle',exportType:'dashboardCheckpoint',schema:'ha-kontrolle-checkpoint-v1',exportedAt:stamp},null,2);
 deliverExport(contents,filename,'application/json',{jsonStamp:stamp});
}
// PDF-Sammelberichte vollständig offline; minimaler PDF-Writer ohne externe Netzbibliothek.
// PDF-Basisschrift Helvetica/WinAnsi, deshalb werden seltene Unicodezeichen lesbar ersetzt.
function pdfSafe(value){const map={'–':'-','—':'-','−':'-','✓':'ja','×':'nein','○':'0','’':"'",'„':'"','“':'"','”':'"','•':'-','…':'...','€':'EUR','⁄':'/','→':'->','⚠':'!','✉':'Mail'};
 return String(value??'').normalize('NFC').replace(/[\u2013\u2014\u2212\u2713\u00d7\u25cb\u2019\u201e\u201c\u201d\u2022\u2026\u20ac\u2044\u2192\u26a0\u2709]/g,c=>map[c]||'?').replace(/[\u0100-\uFFFF]/g,c=>map[c]||'?');}
function pdfLatin(value){const cp={'€':128,'‚':130,'ƒ':131,'„':132,'…':133,'†':134,'‡':135,'ˆ':136,'‰':137,'Š':138,'‹':139,'Œ':140,'Ž':142,'‘':145,'’':146,'“':147,'”':148,'•':149,'–':150,'—':151,'˜':152,'™':153,'š':154,'›':155,'œ':156,'ž':158,'Ÿ':159};
 return Array.from(pdfSafe(value)).map(c=>{let n=c.charCodeAt(0);return n<=255?c:String.fromCharCode(cp[c]||63);}).join('');}
function pdfEsc(value){return pdfLatin(value).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');}
function pdfBytes(text){const a=new Uint8Array(text.length);for(let i=0;i<text.length;i++)a[i]=text.charCodeAt(i)&255;return a;}
function pdfFromPages(contents){let objs=[];
 objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
 objs.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
 const kids=contents.map((_,i)=>`${6+i*2} 0 R`);
 objs.push(`<< /Type /Pages /Kids [${kids.join(' ')}] /Count ${contents.length} >>`);
 objs.push('<< /Type /Catalog /Pages 3 0 R >>');
 for(const content of contents){objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);const id=objs.length;objs.push(`<< /Type /Page /Parent 3 0 R /MediaBox [0 0 595.28 841.89] /Resources << /Font << /F1 1 0 R /F2 2 0 R >> >> /Contents ${id} 0 R >>`);}
 let output='%PDF-1.4\n%\xE2\xE3\xCF\xD3\n',offsets=[0];
 objs.forEach((obj,i)=>{offsets.push(output.length);output+=`${i+1} 0 obj\n${obj}\nendobj\n`;});
 const start=output.length;output+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
 for(const off of offsets.slice(1))output+=String(off).padStart(10,'0')+' 00000 n \n';
 output+=`trailer\n<< /Size ${objs.length+1} /Root 4 0 R >>\nstartxref\n${start}\n%%EOF`;
 return pdfBytes(output);
}

function jsonStamp(x){let t=Date.parse(x||'');return Number.isFinite(t)?t:null;}
function jsonComparison(incoming,current){
 const a=jsonStamp(incoming.updatedAt),b=jsonStamp(current.updatedAt);
 if(!current.courses?.length)return 'empty';
 if(a===null||b===null)return 'unknown';
 if(a<b)return 'older';if(a>b)return 'newer';return 'equal';
}

function parseTaskName(filename){let noext=filename.replace(/\.zip$/i,'').replace(/\s+-\s+\d{2}\.\d{2}\.\d{4}(?:\s+\d{1,2}[_:]\d{2})?.*$/,'');let m=noext.match(/^(.+)_(1|2)_(\d+)(?:_(.+))?$/);if(!m)return null;let [,code,term,number,title]=m;return {code,term:Number(term),number:Number(number),title:(title||`Hausaufgabe ${number}`).replace(/_/g,' ').replace(/-+/g,' – '),id:`${code}_${term}_${Number(number)}`};}
function fileExt(filename){let m=filename.match(/\.([^.]+)$/);return m?'.'+m[1].toLowerCase():'';}
function ignored(path){let parts=path.split('/');return parts.some(n=>n==='__MACOSX'||n==='.DS_Store'||n==='.localized'||n==='Thumbs.db'||n.startsWith('._'));}
function groupStudentPaths(list){let usable=list.filter(x=>!ignored(x.path)&&!x.isDir&&x.path.includes('/'));if(!usable.length)return [];let paths=usable.map(x=>x.path.replace(/^\/+/,''));let p=paths.map(s=>s.split('/'));if(p.length&&p.every(a=>a.length>=3&&a[0]===p[0][0])){return usable.map((x,i)=>({...x,path:p[i].slice(1).join('/')}));}return usable;}
async function consumePackage(info,files,resolutions=new Map()){
 const parsed=parseTaskName(info);if(!parsed)throw Error('Dateiname nicht erkannt: '+info);
 const lists=groupStudentPaths(files);
 if(!lists.length)throw Error('Keine Schülerordner mit Dateien gefunden: '+info);
 const c=ensureCourse(parsed.code),old=c.tasks.find(t=>t.term===parsed.term&&t.number===parsed.number);
 const t=old||{id:parsed.id,term:parsed.term,number:parsed.number,title:parsed.title,sourceName:info,importedAt:'',entries:{}};
 const byStudent=new Map();let ignoredPeople=new Set();
 for(const x of lists){
  const segments=x.path.split('/'),name=segments[0]?.trim(),basename=segments.slice(1).join('/');if(!name||!basename)continue;
  let pupil=studentByName(c,name);
  if(!pupil){const key=norm(parsed.code)+'|'+norm(name),choice=resolutions.get(key);
   if(!choice)throw Error('Name noch nicht zugeordnet: '+name);
   if(choice==='skip'){ignoredPeople.add(key);continue;}
   if(choice==='new') {pupil={id:newid(),name,aliases:[]};c.students.push(pupil);}
   else {pupil=c.students.find(s=>s.id===choice);if(!pupil)throw Error('Die gewählte Person für '+name+' existiert nicht mehr.');
    pupil.aliases=pupil.aliases||[];if(!pupil.aliases.some(a=>norm(a)===norm(name)))pupil.aliases.push(name);
   }
  }
  if(!byStudent.has(pupil.id))byStudent.set(pupil.id,{files:[],comments:[]});
  const rec=byStudent.get(pupil.id),ext=fileExt(basename);
  if(ext==='.txt'){const comment=typeof x.readText==='function'?await x.readText():'';if(comment)rec.comments.push(comment.slice(0,4000));}
  else rec.files.push({name:basename,ext,size:x.size||0});
 }
 const newEntries={};
 for(const [sid,entry] of byStudent){const prev=t.entries[sid];newEntries[sid]={...entry,grade:prev?.grade||'',note:prev?.note||'',override:prev?.override||''};}
 for(const [sid,e] of Object.entries(t.entries))if(!newEntries[sid]&&(e.grade||e.note||e.override))newEntries[sid]={files:[],comments:[],grade:e.grade||'',note:e.note||'',override:e.override||''};
 t.entries=newEntries;t.title=parsed.title;t.sourceName=info;t.importedAt=now();if(!old)c.tasks.push(t);c.tasks.sort((a,b)=>a.term-b.term||a.number-b.number);

 importLog.unshift(`✓ ${result.label} · ${sum.file} Datei · ${sum.text} nur Text · ${sum.missing} fehlend (${c.students.length} Personen)`);
 return result;
}
function stagePackage(info,files){

function parseCSVRows(input,delimiter){

 for(let i=0;i<text.length;i++){
  const ch=text[i];
  if(quoted){
   if(ch==='"'&&text[i+1]==='"'){cell+='"';i++;}
   else if(ch==='"')quoted=false;
   else cell+=ch;
  }else if(ch==='"'&&cell.trim()===''){quoted=true;cell='';}
  else if(ch===delimiter){row.push(cell.trim());cell='';}
  else if(ch==='\n'||ch==='\r'){
   if(ch==='\r'&&text[i+1]==='\n')i++;
   row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);
   row=[];cell='';
  }else cell+=ch;
 }
 if(quoted)throw Error('Die CSV-Datei enthält ein nicht geschlossenes Anführungszeichen.');
 row.push(cell.trim());if(row.some(x=>x!==''))rows.push(row);

}
function guessCSVSeparator(text){
 let candidates=[';',',','\t'],best=';',bestScore=-Infinity;
 for(let sep of candidates){
  let rows;try{rows=parseCSVRows(text,sep).slice(0,15);}catch(e){continue;}
  if(!rows.length)continue;
  let counts=rows.map(r=>r.length),withMultiple=counts.filter(x=>x>1).length;
  const common=counts.sort((a,b)=>a-b)[Math.floor(counts.length/2)];
  const agreement=counts.filter(x=>x===common).length;
  let score=(common>1?40:0)+withMultiple*3+agreement*2+Math.min(common,12);
  if(sep===';')score+=0.1;
  if(score>bestScore){bestScore=score;best=sep;}
 }
 return best;
}
function normHeader(str){return String(str||'').trim().toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[^a-z0-9]/g,'');}
function columnType(s){let x=normHeader(s);

 if(['nachname','nachnamen','lastname','surname','familyname','familienname'].includes(x))return 'last';
 if(['name','vollstaendigername','vollername','anzeigename','displayname','schuelername','schuelerin','schueler','schuelerinnenundschueler','person','personname','mitgliedsname','benutzer','benutzername','teilnehmer','teilnehmername'].includes(x))return 'full';

function setupCSVPreview(filename,text){

 let knownHeaders=new Set(['klasse','kurs','jahrgang','stufe','schuljahr','id','email','mail','gruppe','geschlecht','geburtsdatum','familie','ruf','familienname','rufname','spalte','datum','status']);

function normalizeCSVName(name){

function csvNames(c){

  const row=d.rows[i];let name='';

   name=`${row[d.firstCol]||''} ${row[d.lastCol]||''}`.replace(/\s+/g,' ').trim();
  }

 case 'deletestudent':{let s=c?.students.find(x=>x.id===sId);if(!s||!confirm(`„${s.name}“ wirklich aus der Klassenliste entfernen? Vorhandene Einreichungszuordnungen gehen dabei ebenfalls verloren.`))return;c.students=c.students.filter(x=>x.id!==sId);for(let t of c.tasks)delete t.entries[sId];save();render();break;}
 case 'reset':if(confirm('Wirklich alle im Browser gespeicherten Klassen, Aufgaben und Bewertungen löschen? Diese Aktion kann nicht rückgängig gemacht werden.')){state=emptyState();rosterCsv=null;save();tab='overview';render();}break;
 case 'newcourse':{let code=prompt('Kurskürzel (z. B. G7, M10, G12):');if(!code)return;code=code.trim();if(!/^[a-zA-Z0-9_-]{2,25}$/.test(code)){alert('Bitte nur Buchstaben, Zahlen, Unterstriche oder Bindestriche.');return;}ensureCourse(code);save();tab='roster';render();break;}
 }}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el){e.preventDefault();handleAction(el);}if(e.target?.id==='modalBackdrop'){dialog=null;renderModal();}});
document.addEventListener('change',async e=>{let t=e.target;if(t.classList.contains('import-map')){importResolution[t.dataset.key]=t.value;return;}if(t.id==='sectionSelect'){setTab(t.value);}else if(t.id==='courseSelect'){state.selectedCourseId=t.value;rosterCsv=null;save(false);reviewTaskId='';render();}else if(t.id==='reviewTask'){reviewTaskId=t.value;render();}else if(t.id==='profilePicker'){profileId=t.value;render();}else if(t.id==='zipPicker'&&t.files.length){await handleZipFiles([...t.files]);t.value='';}else if(t.id==='folderPicker'&&t.files.length){await handleFolderObjects([...t.files].map(f=>({path:f.webkitRelativePath||f.name,file:f})));t.value='';}else if(t.id==='jsonPicker'&&t.files.length){await importJSON(t.files[0]);t.value='';}
 else if(t.id==='rosterCsvPicker'&&t.files.length){await loadRosterCSV(t.files[0]);t.value='';}
 else if(rosterCsv&&['csvNameMode','csvFirstCol','csvLastCol','csvFullCol'].includes(t.id)){const k={csvNameMode:'mode',csvFirstCol:'firstCol',csvLastCol:'lastCol',csvFullCol:'fullCol'}[t.id];rosterCsv[k]=t.id==='csvNameMode'?t.value:Number(t.value);render();}});
document.addEventListener('input',e=>{if(e.target.id==='overviewSearch'){overviewQuery=e.target.value;let cursor=overviewQuery.length;render();let input=$('#overviewSearch');if(input){input.focus();input.setSelectionRange(cursor,cursor);}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&dialog){dialog=null;renderModal();}});
document.addEventListener('dragover',e=>{if(e.dataTransfer?.types?.includes('Files')){e.preventDefault();if($('#dropzone'))$('#dropzone').classList.add('over');if(tab==='roster'&&$('#csvDrop'))$('#csvDrop').classList.add('over');}});
document.addEventListener('dragleave',e=>{if(e.target?.id==='dropzone'||e.target?.id==='csvDrop')e.target.classList.remove('over');});
document.addEventListener('drop',async e=>{e.preventDefault();$('#dropzone')?.classList.remove('over');$('#csvDrop')?.classList.remove('over');let dt=e.dataTransfer;if(!dt?.files?.length)return;if(tab==='roster'&&[...dt.files].some(f=>/\.(csv|txt)$/i.test(f.name))){const f=[...dt.files].find(f=>/\.(csv|txt)$/i.test(f.name));await loadRosterCSV(f);return;}let zips=[...dt.files].filter(f=>/\.zip$/i.test(f.name));let objs=[];if(dt.items?.length){for(let item of dt.items){let ent=item.webkitGetAsEntry?.();if(ent&&ent.isDirectory)objs.push(...await readEntry(ent));}}if(zips.length)await handleZipFiles(zips);if(objs.length)await handleFolderObjects(objs);if(!zips.length&&!objs.length)alert('Bitte ZIP-Dateien auswählen oder den Ordner-Dialog nutzen.');});
 // Natürliches Seitenscrollen; bei vielen Aufgaben nur waagerecht im Raster scrollen.
 render();
 </script></body></html>
