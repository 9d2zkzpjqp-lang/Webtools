 <style>

*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--navy);background:#e9f1f4;-webkit-tap-highlight-color:transparent}.sr-only{position:absolute;width:1px;height:1px;padding:0;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #42a0df;outline-offset:2px}.app{height:100dvh;min-height:540px;max-width:var(--maxw);margin:auto;background:#fff;display:flex;flex-direction:column;position:relative;box-shadow:0 0 32px #0031480e;overflow:hidden}
.head{background:var(--navy);color:white;padding:14px 16px 12px;position:relative;z-index:30}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.school-name{font-size:10px;letter-spacing:.135em;font-weight:790;opacity:.86}.tag{font-size:10px;letter-spacing:.04em;background:#2a5266;border:1px solid #628498;border-radius:5px;padding:4px 7px;font-weight:700}.head h1{font-size:clamp(22px,5vw,28px);margin:5px 0 11px;letter-spacing:-.025em;font-weight:780;line-height:1.15}.searchbox{background:#fff;border-radius:11px;position:relative;display:flex;align-items:center;min-height:48px;box-shadow:0 3px 12px #0002;color:#556573}.searchglyph{font-size:28px;line-height:1;padding:0 10px 4px 13px;color:#466578;transform:rotate(-25deg)}.searchbox input{border:0;background:transparent;min-width:0;flex:1;outline:0;color:#0a2c40;font-size:16px;height:48px;padding:0 2px}.searchbox input::placeholder{color:#7b8d98;font-size:15px}.clear{border:0;color:#536674;background:#ecf2f5;border-radius:50%;height:29px;width:29px;margin:0 10px 0 5px;font-size:21px;line-height:1}
.suggestions{position:absolute;top:calc(100% + 7px);left:0;right:0;background:white;border:1px solid var(--line);box-shadow:0 12px 30px #061d3247;border-radius:11px;max-height:min(50dvh,330px);overflow:auto;z-index:60}.suggestion{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:10px;padding:12px 13px;background:white;width:100%;border:0;border-bottom:1px solid #eaf0f3;color:#14364a}.suggestion:last-child{border-bottom:0}.suggestion strong{display:block;font-size:14px}.suggestion small{color:#597181;display:block;margin-top:3px;font-size:12px}.suggestion .place{background:#edf5f8;color:#195579;border-radius:6px;padding:5px 7px;flex-shrink:0;font-size:12px;font-weight:800}.suggestion:active{background:#e8f4fa}.no-results{font-size:14px;padding:15px;color:#506575}
.demo{padding:8px 14px;display:flex;align-items:center;gap:9px;background:#fff4df;border-bottom:1px solid #f4dcad;font-size:12px;line-height:1.3;color:#765018}.demopill{padding:3px 7px;background:#f3dfb3;border-radius:5px;font-size:10px;letter-spacing:.02em;font-weight:850;text-transform:uppercase;color:#75511c;flex-shrink:0}
.tabs{display:flex;gap:4px;padding:9px 12px 0;background:#fff;border-bottom:1px solid var(--line)}.tab{flex:1;max-width:250px;display:flex;align-items:center;justify-content:center;gap:7px;color:#677b88;border:0;border-bottom:3px solid transparent;background:transparent;padding:7px 4px 9px;font-weight:730;font-size:14px}.tab.active{color:#105d83;border-bottom-color:#1776a8}.tab:first-letter{font-size:19px}
.main{display:flex;flex:1;min-height:0;position:relative}.map-panel,.list-panel{display:flex;flex-direction:column;flex:1;min-height:0;min-width:0}.map-panel[hidden],.list-panel[hidden]{display:none}.floorbar{display:flex;gap:7px;padding:10px 12px 10px;background:#fff}.floor{flex:1;border:1px solid #dbe5eb;background:#f2f6f8;color:#344f5f;border-radius:9px;font-weight:750;font-size:13px;min-height:41px;padding:8px 5px;white-space:nowrap}.floor.active{background:#14698d;border-color:#14698d;color:white;box-shadow:0 2px 7px #0d648d33}
.map-viewport{flex:1;min-height:180px;background:#f5f8fa;position:relative;overflow:hidden;touch-action:none;user-select:none;cursor:grab;overscroll-behavior:contain}.map-viewport.grabbing{cursor:grabbing}.map-world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}.map-world img{position:absolute;top:0;left:0;display:block;pointer-events:none;max-width:none;user-select:none}.map-world svg{position:absolute;top:0;left:0;pointer-events:none;overflow:visible}.room-selected{fill:#166bde38;stroke:#0868dd;stroke-width:3.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}.offer-pin{fill:#176c9f;stroke:white;stroke-width:2;vector-effect:non-scaling-stroke;filter:drop-shadow(0 1px 1px #101b2880)}.offer-pin.active{fill:#e37314}.zoomcontrols{position:absolute;z-index:10;right:13px;bottom:53px;display:grid;gap:5px}.zoomcontrols button{width:42px;height:42px;background:white;border:1px solid #d8e5e9;border-radius:11px;color:#204b65;font-weight:750;font-size:23px;box-shadow:0 3px 9px #0b2a3523}.zoomcontrols .home{font-size:22px}.maphint{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);text-align:center;font-size:11px;background:#fffef3ea;border:1px solid #e3e3d4;box-shadow:0 2px 8px #0001;border-radius:20px;padding:7px 10px;white-space:nowrap;pointer-events:none;color:#526472}.mapfoot{display:flex;align-items:center;justify-content:space-between;gap:7px;padding:10px 13px;min-height:42px;font-size:10.5px;color:#61737e;background:white;border-top:1px solid var(--line)}.mapfoot button{color:#15618c;font-size:11px;font-weight:700;background:transparent;border:0;padding:7px 2px;white-space:nowrap}.markerkey{height:9px;width:9px;background:#176c9f;border:1px solid white;border-radius:50%;box-shadow:0 0 0 1px #176c9f;display:inline-block;margin-right:4px}
.list-panel{overflow:hidden;background:#f6f9fa}.filterbar{padding:10px 12px;display:flex;flex-shrink:0;gap:7px;overflow:auto;scrollbar-width:none;background:white;border-bottom:1px solid var(--line)}.filterbar::-webkit-scrollbar{display:none}.filter{white-space:nowrap;border:1px solid var(--line);border-radius:99px;color:#496476;background:#fff;font-size:12px;min-height:36px;padding:6px 13px;font-weight:700}.filter.active{background:var(--navy);border-color:var(--navy);color:white}.offers{flex:1;overflow:auto;padding:14px 14px 26px;overscroll-behavior:contain}.offers h2{margin:5px 0 13px;font-size:16px}.offer-card{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:69px;border:1px solid #e1e9ef;background:#fff;border-radius:12px;margin:0 0 9px;padding:12px;box-shadow:0 2px 8px #0f365909;color:#173a4d}.offer-card:active{background:#eff7fa}.offer-card .room-number{font-size:13px;font-weight:850;color:#14638d;background:#e9f3f8;min-width:60px;padding:8px 6px;border-radius:8px;text-align:center;flex-shrink:0}.offer-card .card-main{min-width:0;flex:1}.offer-card strong{display:block;font-size:13px;line-height:1.3}.offer-card small{display:block;color:#6a7c86;font-size:11px;margin-top:5px}.offer-card .arrow{font-size:22px;color:#7a919f}.offer-card.disabled .room-number{color:#7f735c;background:#f5eee0}.offer-card.disabled .arrow{display:none}
.detail-backdrop{position:absolute;inset:0;background:#0c2a3b2a;z-index:39}.detail{position:absolute;bottom:0;left:0;right:0;z-index:40;background:#fff;border-radius:19px 19px 0 0;box-shadow:0 -6px 32px #0a1e3240;max-height:min(48dvh,440px);overflow:auto;padding:12px 21px max(21px,env(safe-area-inset-bottom));animation:slideup .18s ease-out}.detail[hidden],.detail-backdrop[hidden]{display:none}.sheet-handle{width:38px;height:4px;border-radius:4px;background:#c6d0d6;margin:0 auto 9px}.close-detail{position:absolute;right:16px;top:14px;border:0;background:#edf3f6;border-radius:50%;height:32px;width:32px;color:#4a6373;font-size:22px}.detail-floor{color:#1472a2;letter-spacing:.055em;text-transform:uppercase;font-size:11px;font-weight:800;margin-bottom:5px}.detail h2{font-size:21px;line-height:1.2;margin:0 37px 13px 0}.detail-offer{padding:10px 0;border-top:1px solid #e2ebef;font-size:14px;line-height:1.4}.detail-offer .chip{display:inline-block;font-weight:730;color:#795418;font-size:10px;letter-spacing:.02em;background:#fff1d5;padding:4px 7px;border-radius:5px;margin-bottom:6px}.detail-offer strong{display:block}.detail-offer p{margin:5px 0 0;color:#687681;font-size:12px}.detail-empty{padding:12px 0;border-top:1px solid var(--line);color:#677985;font-size:13px;line-height:1.45}
@keyframes slideup{from{transform:translateY(13px);opacity:.7}to{transform:translateY(0);opacity:1}}
@media(min-width:760px){.app{height:min(95dvh,970px);min-height:690px;margin:2.5dvh auto;border-radius:16px}.head{padding:18px 25px 15px}.head h1{font-size:29px}.demo{padding:10px 25px}.tabs{padding-left:25px}.floorbar{padding:14px 25px}.mapfoot{padding:10px 25px}.detail{left:auto;width:365px;right:17px;bottom:56px;border-radius:17px;max-height:55%;padding-bottom:20px}.detail-backdrop{background:transparent;pointer-events:none}.maphint{font-size:12px}.zoomcontrols{bottom:59px;right:20px}}
@media(max-height:650px){.head{padding-top:8px;padding-bottom:8px}.head h1{font-size:20px;margin:3px 0 7px}.searchbox,.searchbox input{height:43px;min-height:43px}.floorbar{padding-top:6px;padding-bottom:6px}.floor{min-height:37px}}
@media(prefers-reduced-motion:reduce){.detail{animation:none}*{scroll-behavior:auto!important}}

/* Mobile First v2: Schalter Karte/Angebote zuerst, Raumplan als Hauptfläche. */
:root{--brand:#102d42;--accent:#176c92}
.app{height:100dvh;min-height:0}
.head{flex:none;padding:calc(9px + env(safe-area-inset-top, 0px)) 12px 10px;z-index:31}
.topline{height:24px;align-items:center;margin-bottom:8px}
.school-name{font-size:10px;letter-spacing:.12em}
.demo-note{position:relative;flex:none;color:#fff}
.demo-note summary{list-style:none;cursor:pointer;font-size:10px;font-weight:800;letter-spacing:.04em;color:#ffe2a5;border:1px solid #608094;background:#274e64;border-radius:7px;padding:6px 8px;white-space:nowrap}
.demo-note summary::-webkit-details-marker{display:none}
.demo-popup{position:absolute;z-index:100;top:calc(100% + 8px);right:0;width:min(325px,calc(100vw - 24px));padding:13px 14px;background:#fffdf5;color:#453b28;border:1px solid #ecd3a8;border-radius:10px;box-shadow:0 12px 26px #091a29a8;font-size:13px;line-height:1.4;font-weight:400;letter-spacing:0}
.tabs{display:flex;gap:5px;border:0;padding:4px;background:#214357;border-radius:11px;margin:0 0 9px}
.tab,.tab:first-letter{flex:1;max-width:none;display:flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:8px;background:transparent;color:#c8d9e4;min-height:36px;padding:7px 8px;font-weight:780;font-size:14px;line-height:1}
.tab.active{color:#103850;background:white;box-shadow:0 1px 5px #041e3150}
.tab-icon{font-size:17px;font-weight:400;line-height:1;opacity:.9}
.searchbox{min-height:40px;height:40px;border-radius:9px;box-shadow:none}
.searchbox input{height:40px;font-size:16px}
.searchbox input::placeholder{font-size:14px}
.searchglyph{font-size:25px;padding-left:12px;padding-right:9px}
.main{min-height:0}
.floorbar{padding:7px 10px;gap:6px;border-bottom:1px solid #e2e9ed;flex:none}
.floor{min-height:36px;padding:6px 5px;border-radius:8px;font-size:13px}
.map-viewport{min-height:0;background:#f4f8fa}
.map-actions{position:absolute;z-index:10;top:10px;right:10px}
.pin-toggle{display:flex;align-items:center;gap:6px;background:#fffffff2;border:1px solid #d3e2e9;border-radius:22px;box-shadow:0 2px 7px #0825361c;color:#1c536d;font-weight:750;font-size:12px;min-height:33px;padding:5px 10px}
.pin-dot{width:8px;height:8px;background:#176c9f;border:1px solid white;box-shadow:0 0 0 1px #176c9f;border-radius:50%}
.pin-toggle[aria-pressed="false"] .pin-dot{background:#afb6bb;box-shadow:0 0 0 1px #afb6bb}
.toggle-state{font-weight:500;color:#768992}
.zoomcontrols{right:10px;bottom:14px;gap:5px}
.zoomcontrols button{width:37px;height:37px;border-radius:10px;font-size:21px;box-shadow:0 2px 8px #0b2a351a}
.zoomcontrols .home{font-size:21px}
.list-panel{background:#f5f8fa}
.list-intro{padding:10px 13px 0;font-size:12px;line-height:1.35;color:#59707e;background:#fff}
.list-intro strong{color:#8b5c1e}
.filterbar{padding:10px 12px;gap:6px}
.filter{min-height:34px;padding:6px 11px}
.room-filter{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#e3f2f9;color:#124c6c;padding:10px 14px;font-weight:750;font-size:12px;border-bottom:1px solid #cee5f3}
.room-filter[hidden]{display:none}
.room-filter button{border:0;background:transparent;color:#125f8a;font-weight:800;padding:5px;white-space:nowrap;font-size:12px}
.offers{padding:13px 12px 24px}
.offers h2{font-size:14px;font-weight:750;margin:2px 2px 12px}
.offer-card{min-height:65px;padding:11px 12px;margin-bottom:8px}
.offer-card .room-number{min-width:54px}
.offer-card small{font-size:12px}
.offer-card .arrow{color:#1a729d}
.detail{max-height:min(60dvh,470px);padding-top:12px}
.see-offers{display:block;margin-top:13px;width:100%;background:#14698d;color:#fff;border:0;border-radius:10px;padding:13px 12px;font-weight:780;font-size:13px;text-align:center}
.see-offers[hidden]{display:none}
.see-offers span{margin-left:4px}
@media(min-width:760px){
 .app{height:min(95dvh,970px);min-height:690px}
 .head{padding:15px 24px 12px}
 .topline{margin-bottom:10px}
 .tabs{max-width:520px;margin-bottom:11px}
 .searchbox{max-width:690px}
 .floorbar{padding:10px 24px}
 .zoomcontrols{right:16px;bottom:18px}
 .map-actions{top:15px;right:16px}
 .detail{padding-bottom:22px}
}
@media(max-height:670px){
 .head{padding-top:calc(5px + env(safe-area-inset-top, 0px));padding-bottom:7px}
 .topline{margin-bottom:5px}
 .tabs{margin-bottom:6px}
 .floorbar{padding-top:5px;padding-bottom:5px}
 .floor{min-height:33px}
}

</style>
</head>
<body>
<div class="app" id="app">
 <header class="head">
  <div class="topline">
   <span class="school-name">HERDERSCHULE GIESSEN</span>
   <details class="demo-note" id="demoNote">
    <summary aria-label="Hinweis zur Vorschau von 2025">VORSCHAU · 2025 <span aria-hidden="true">ⓘ</span></summary>
    <div class="demo-popup">Dies ist ein <strong>technischer Prototyp</strong> mit dem Veranstaltungsprogramm von <strong>2025</strong> – noch nicht das Programm für den 31. Oktober 2026.</div>
   </details>
  </div>
  <nav class="tabs" role="tablist" aria-label="Ansicht wählen">
   <button class="tab active" id="tab-map" type="button" role="tab" aria-selected="true" aria-controls="panel-map"><span class="tab-icon" aria-hidden="true">▧</span> Karte</button>
   <button class="tab" id="tab-list" type="button" role="tab" aria-selected="false" aria-controls="panel-list"><span class="tab-icon" aria-hidden="true">☷</span> Angebote</button>
  </nav>
  <div class="searchbox" id="searchBox">
   <span class="searchglyph" aria-hidden="true">⌕</span>
   <label for="search" class="sr-only">Raum oder Angebot suchen</label>
   <input id="search" type="search" placeholder="Raum oder Fach suchen" autocomplete="off" spellcheck="false" aria-autocomplete="list" aria-controls="suggestions">
   <button id="searchClear" type="button" class="clear" aria-label="Suche löschen" hidden>×</button>
   <div id="suggestions" class="suggestions" role="listbox" hidden></div>
  </div>
 </header>
 <main class="main">
  <section class="map-panel" id="panel-map" role="tabpanel" aria-labelledby="tab-map">
   <div class="floorbar" role="group" aria-label="Etage wählen">
    <button type="button" class="floor active" data-floor="eg" aria-pressed="true">EG</button>
    <button type="button" class="floor" data-floor="og1" aria-pressed="false">1. OG</button>
    <button type="button" class="floor" data-floor="og2" aria-pressed="false">2. OG</button>
   </div>
   <div id="mapViewport" class="map-viewport" aria-label="Interaktiver Gebäudeplan: durch Berühren verschieben und mit zwei Fingern zoomen">
    <div id="mapWorld" class="map-world">
     <img id="floorImage" draggable="false" alt="Original-Gebäudeplan" />
     <svg id="overlay" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"></svg>
    </div>
    <div class="map-actions"><button id="showPins" type="button" class="pin-toggle" aria-pressed="true" aria-label="Angebotsmarkierungen ein- oder ausblenden"><span aria-hidden="true" class="pin-dot"></span> Angebote <span class="toggle-state" id="pinState">an</span></button></div>
    <div class="zoomcontrols" role="group" aria-label="Karte vergrößern oder verkleinern">
     <button type="button" id="zoomIn" aria-label="Vergrößern">+</button>
     <button type="button" id="zoomOut" aria-label="Verkleinern">−</button>
     <button type="button" id="zoomHome" class="home" aria-label="Gesamten Plan anzeigen">⤢</button>
    </div>
   </div>
  </section>
  <section class="list-panel" id="panel-list" role="tabpanel" aria-labelledby="tab-list" hidden>
   <div class="list-intro"><span>ANGEBOTE <strong>2025</strong> · Angebot antippen, um den Raum auf der Karte zu sehen</span></div>
   <div class="filterbar" role="group" aria-label="Angebotskategorie">
    <button type="button" class="filter active" data-filter="alle" aria-pressed="true">Alle</button>
    <button type="button" class="filter" data-filter="kinder" aria-pressed="false">Für Kinder</button>
    <button type="button" class="filter" data-filter="eltern" aria-pressed="false">Für Eltern</button>
    <button type="button" class="filter" data-filter="offen" aria-pressed="false">Räume ansehen</button>
    <button type="button" class="filter" data-filter="service" aria-pressed="false">Service</button>
   </div>
   <div id="roomFilter" class="room-filter" hidden><span id="roomFilterText"></span><button id="clearRoomFilter" type="button">Alle zeigen ×</button></div>
   <div id="offers" class="offers"></div>
  </section>
 </main>
 <div class="detail-backdrop" id="detailBackdrop" hidden></div>
 <aside id="detail" class="detail" role="dialog" aria-modal="false" aria-labelledby="detailTitle" hidden>
  <div class="sheet-handle" aria-hidden="true"></div>
  <button id="closeDetail" class="close-detail" type="button" aria-label="Rauminformation schließen">×</button>
  <div class="detail-floor" id="detailFloor"></div>
  <h2 id="detailTitle"></h2>
  <div id="detailOffers"></div>
  <button id="seeRoomOffers" class="see-offers" type="button" hidden>Diese Angebote in der Liste ansehen <span aria-hidden="true">→</span></button>
 </aside>
</div>
<script>
/* Originalgrafiken liegen unverändert im Ordner plaene/.
   Raumkonturen und Veranstaltungen werden ausschließlich hier beschrieben.
   Alle Angebote stammen noch aus 2025 und sind keine Angaben für 2026! */
window.SCHOOL_MAP = {
  "version": 1,
  "basis": "2025-11-01",
  "demo": true,
  "name": "Herderschule Gießen",
  "floors": [
    {
      "id": "eg",

<script>
"use strict";
(()=>{
const data=window.SCHOOL_MAP;
if(!data) throw Error('Raumdaten fehlen');
const $=id=>document.getElementById(id);
const dom={viewport:$('mapViewport'), world:$('mapWorld'),img:$('floorImage'), svg:$('overlay'), search:$('search'), suggestions:$('suggestions'), detail:$('detail'), detailBackdrop:$('detailBackdrop'), clear:$('searchClear')};
const roomByKey=new Map(data.rooms.map(r=>[r.floor+':'+r.id,r]));
// Alle 2025-Beispielangebote, nach Raum gruppiert.
const eventsForRoom=room=>data.events.filter(e=>e.room===room.id && roomByKey.get(room.floor+':'+e.room)===room);
const floorForRoom=id=>data.floors.find(f=>roomByKey.has(f.id+':'+id));
const floorName=id=>data.floors.find(f=>f.id===id)?.name||'Unbekannte Etage';
const getRoom=id=>data.rooms.find(r=>r.id===id) || null;
const state={floor:'eg',view:'map',filter:'alle',listRoom:null,pins:true,selected:null,s:1,tx:0,ty:0,fit:1,pointers:new Map(),start:null,moved:false,gesture:false};
const svgns='http://www.w3.org/2000/svg';
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMapSize(){const f=data.floors.find(x=>x.id===state.floor);dom.img.src=f.image;dom.img.width=f.w;dom.img.height=f.h;dom.img.alt='Original-Gebäudeplan '+f.name+' (Fassung 2025, unverändert)';dom.world.style.width=f.w+'px';dom.world.style.height=f.h+'px';dom.svg.setAttribute('width',f.w);dom.svg.setAttribute('height',f.h);dom.svg.setAttribute('viewBox',`0 0 ${f.w} ${f.h}`);}
function bounds(){return {w:dom.viewport.clientWidth,h:dom.viewport.clientHeight,f:data.floors.find(x=>x.id===state.floor)}}
function clamp(){let {w,h,f}=bounds();const contentW=f.w*state.s,contentH=f.h*state.s; const pad=12;
 state.tx=contentW <= w ? (w-contentW)/2 : Math.max(w-contentW-pad,Math.min(pad,state.tx));
 state.ty=contentH <= h ? (h-contentH)/2 : Math.max(h-contentH-pad,Math.min(pad,state.ty));}
function renderTransform(){clamp();dom.world.style.transform=`translate3d(${state.tx}px,${state.ty}px,0) scale(${state.s})`;}
function fit(){const {w,h,f}=bounds();if(!w||!h)return;state.fit=Math.min((w-26)/f.w,(h-24)/f.h);state.s=state.fit;state.tx=(w-f.w*state.s)/2;state.ty=(h-f.h*state.s)/2;renderTransform();}
function mapZoom(newScale,cx,cy){const oldS=state.s;let min=state.fit*.8,max=Math.max(3.5,state.fit*6);
 newScale=Math.max(min,Math.min(max,newScale)); const px=(cx-state.tx)/oldS,py=(cy-state.ty)/oldS;
 state.s=newScale;state.tx=cx-px*newScale;state.ty=cy-py*newScale;renderTransform();}
function zoomBy(factor){const r=bounds();mapZoom(state.s*factor,r.w/2,r.h/2)}
function pinRooms(){return data.rooms.filter(r=>r.floor===state.floor && eventsForRoom(r).length>0)}
function repaintOverlay(){dom.svg.replaceChildren();
 if(state.pins){for(const r of pinRooms()){
  const [x,y,w,h]=r.rect;const dot=document.createElementNS(svgns,'circle');dot.setAttribute('cx',x+w-7);dot.setAttribute('cy',y+8);dot.setAttribute('r',6.5);dot.setAttribute('class','offer-pin'+(state.selected===r?' active':''));dom.svg.appendChild(dot);
 }}
 if(state.selected && state.selected.floor===state.floor){const [x,y,w,h]=state.selected.rect;const rect=document.createElementNS(svgns,'rect');for(const [k,v] of Object.entries({x,y,width:w,height:h,rx:1}))rect.setAttribute(k,v);rect.setAttribute('class','room-selected');dom.svg.appendChild(rect);}
}
function setFloor(id,reset=true){if(state.floor!==id){state.floor=id;setMapSize();}document.querySelectorAll('[data-floor]').forEach(b=>{const yes=b.dataset.floor===id;b.classList.toggle('active',yes);b.setAttribute('aria-pressed',yes)});repaintOverlay();if(reset)requestAnimationFrame(fit);}
function showView(which,options={}){
 state.view=which;const onMap=which==='map';
 if(!onMap && !options.keepRoom)state.listRoom=null;
 $('panel-map').hidden=!onMap;$('panel-list').hidden=onMap;
 for(const id of ['map','list']){const active=id===which;const b=$('tab-'+id);b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active));b.tabIndex=active?0:-1;}
 dom.search.placeholder=onMap?'Raum oder Fach suchen':'Angebote durchsuchen';
 hideSuggestions();dom.search.blur();
 if(onMap){requestAnimationFrame(()=>{if(state.selected)focusRoom(state.selected);else fit();});}
 else{closeDetail();renderOffers();}
}
function showOffersForRoom(room){
 state.listRoom=room;state.filter='alle';dom.search.value='';dom.clear.hidden=true;
 document.querySelectorAll('.filter').forEach(b=>{const active=b.dataset.filter==='alle';b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));});
 showView('list',{keepRoom:true});$('offers').scrollTop=0;
}
function focusRoom(room){const {w,h}=bounds();if(!w||!h)return;const [x,y,rw,rh]=room.rect;const target=Math.min(Math.max(3.5,state.fit*6),Math.max(1.85,state.fit*1.9));state.s=target;state.tx=w*.5-(x+rw*.5)*target;state.ty=h*.40-(y+rh*.5)*target;renderTransform();}
const categories={kinder:'Für Kinder',eltern:'Für Eltern',offen:'Zur Ansicht geöffnet',service:'Service'};
function detailContent(room){const evs=eventsForRoom(room);$('seeRoomOffers').hidden=!evs.length;$('detailFloor').textContent=floorName(room.floor)+' · Übersicht 2025';$('detailTitle').textContent=room.label;
 $('detailOffers').innerHTML=evs.length?evs.map(e=>`<div class="detail-offer"><span class="chip">${categories[e.category]} · 2025</span><strong>${escapeHTML(e.title)}</strong>${e.note?`<p>${escapeHTML(e.note)}</p>`:''}</div>`).join(''):'<div class="detail-empty">Für diesen Raum ist im Vorjahresprogramm 2025 kein Angebot hinterlegt. Der Raum kann dennoch auf dem Plan lokalisiert werden.</div>';
}
function openRoom(room){if(!room)return;state.selected=room;setFloor(room.floor,false);repaintOverlay();showView('map');requestAnimationFrame(()=>{focusRoom(room);});detailContent(room);dom.detail.hidden=false;dom.detailBackdrop.hidden=false;hideSuggestions();dom.search.blur();}
function closeDetail(){dom.detail.hidden=true;dom.detailBackdrop.hidden=true;state.selected=null;repaintOverlay();}
function pointRoom(x,y){let found=null;const eligible=data.rooms.filter(r=>r.floor===state.floor);for(const r of eligible){const [rx,ry,rw,rh]=r.rect;if(x>=rx&&x<=rx+rw&&y>=ry&&y<=ry+rh){if(!found||rw*rh<found.rect[2]*found.rect[3])found=r;}}return found;}
function pixelAt(clientX,clientY){const rect=dom.viewport.getBoundingClientRect();return{x:(clientX-rect.left-state.tx)/state.s,y:(clientY-rect.top-state.ty)/state.s}}
const distance=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const mid=(a,b)=>({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
dom.viewport.addEventListener('pointerdown',e=>{if(e.target.closest('.zoomcontrols, .map-actions'))return;if(e.pointerType==='mouse' && e.button!==0)return;
 const rect=dom.viewport.getBoundingClientRect();state.pointers.set(e.pointerId,{x:e.clientX-rect.left,y:e.clientY-rect.top});
 try{dom.viewport.setPointerCapture(e.pointerId)}catch{};
 if(state.pointers.size===1){state.start={x:e.clientX-rect.left,y:e.clientY-rect.top,tx:state.tx,ty:state.ty};state.moved=false;state.gesture=false;}
 else if(state.pointers.size===2){const [a,b]=[...state.pointers.values()];const ctr=mid(a,b);state.start={center:ctr,dist:distance(a,b),scale:state.s,px:(ctr.x-state.tx)/state.s,py:(ctr.y-state.ty)/state.s};state.gesture=true;state.moved=true;}
 dom.viewport.classList.add('grabbing');});
dom.viewport.addEventListener('pointermove',e=>{if(!state.pointers.has(e.pointerId))return;const rect=dom.viewport.getBoundingClientRect();state.pointers.set(e.pointerId,{x:e.clientX-rect.left,y:e.clientY-rect.top});
 if(state.pointers.size===2){const [a,b]=[...state.pointers.values()],ctr=mid(a,b);const s=state.start;state.s=Math.max(state.fit*.8,Math.min(Math.max(3.5,state.fit*6),s.scale*distance(a,b)/Math.max(1,s.dist)));state.tx=ctr.x-s.px*state.s;state.ty=ctr.y-s.py*state.s;renderTransform();state.moved=true;}
 else if(state.pointers.size===1 && !state.gesture){const p=[...state.pointers.values()][0],s=state.start;if(!s)return;if(Math.hypot(p.x-s.x,p.y-s.y)>5)state.moved=true;state.tx=s.tx+p.x-s.x;state.ty=s.ty+p.y-s.y;renderTransform();}
});
function endPointer(e){if(!state.pointers.has(e.pointerId))return;const tap=!state.moved&&!state.gesture&&state.pointers.size===1;state.pointers.delete(e.pointerId);if(tap){const p=pixelAt(e.clientX,e.clientY);const room=pointRoom(p.x,p.y);if(room)openRoom(room);else closeDetail();}
 if(state.pointers.size===1){const p=[...state.pointers.values()][0];state.start={x:p.x,y:p.y,tx:state.tx,ty:state.ty};state.gesture=true;}else if(state.pointers.size===0){dom.viewport.classList.remove('grabbing');state.start=null;}
}
dom.viewport.addEventListener('pointerup',endPointer);dom.viewport.addEventListener('pointercancel',e=>{state.pointers.delete(e.pointerId);if(!state.pointers.size){state.gesture=false;state.start=null;dom.viewport.classList.remove('grabbing')}});
dom.viewport.addEventListener('wheel',e=>{e.preventDefault();const r=dom.viewport.getBoundingClientRect();mapZoom(state.s*(e.deltaY<0?1.14:.88),e.clientX-r.left,e.clientY-r.top)},{passive:false});
$('zoomIn').onclick=()=>zoomBy(1.35);$('zoomOut').onclick=()=>zoomBy(1/1.35);$('zoomHome').onclick=()=>fit();
document.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{closeDetail();setFloor(b.dataset.floor)});
$('tab-map').onclick=()=>showView('map');$('tab-list').onclick=()=>showView('list');
$('seeRoomOffers').onclick=()=>{if(state.selected)showOffersForRoom(state.selected);};
$('clearRoomFilter').onclick=()=>{state.listRoom=null;renderOffers();};
$('closeDetail').onclick=closeDetail;dom.detailBackdrop.onclick=closeDetail;
$('showPins').onclick=()=>{state.pins=!state.pins;$('pinState').textContent=state.pins?'an':'aus';$('showPins').setAttribute('aria-pressed',String(state.pins));repaintOverlay()};
// Suchen ohne externe Dienste oder Netzwerkzugriffe. Raum 5 = ggf. Raum 005.
const norm=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim();
function roomDescription(room){const evs=eventsForRoom(room);return evs.map(e=>e.title).join(' · ')}
function searchRooms(raw){const n=norm(raw);if(!n)return[];const compact=n.replace(/^raum\s*/,''),numeric=/^\d+$/.test(compact)?compact.padStart(3,'0'):null;
 return data.rooms.map((r,i)=>{const label=norm(r.label),ex=norm(roomDescription(r));let score=0;
 if(numeric && r.id===numeric)score=100;
 else if(label===n||norm(r.id)===n)score=95;
 else if(r.id.startsWith(compact)&&compact.length>1)score=76;
 else if(label.includes(n))score=68;
 else if(ex.includes(n))score=54;
 return{room:r,score,i}}).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||a.i-b.i).slice(0,14).map(x=>x.room);
}
function hideSuggestions(){dom.suggestions.hidden=true;dom.suggestions.innerHTML=''}
function renderSuggestions(){const val=dom.search.value.trim();dom.clear.hidden=!val;if(state.view==='list'){hideSuggestions();renderOffers();return;}if(!val){hideSuggestions();return;}const found=searchRooms(val);
 dom.suggestions.innerHTML=found.length?found.map((r,i)=>`<button type="button" class="suggestion" role="option" data-sug="${i}"><span><strong>${escapeHTML(r.label)}</strong><small>${escapeHTML(roomDescription(r).slice(0,115)||'Raum im Gebäudeplan')}</small></span><span class="place">${escapeHTML(data.floors.find(f=>f.id===r.floor).short)}</span></button>`).join(''):'<div class="no-results">Kein Raum gefunden. Versuche eine Raumnummer oder ein Fach.</div>';
 dom.suggestions.hidden=false;dom.suggestions.querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{openRoom(found[Number(b.dataset.sug)]);});}
dom.search.addEventListener('input',renderSuggestions);dom.search.addEventListener('focus',renderSuggestions);
dom.search.addEventListener('keydown',e=>{if(e.key==='Escape'){hideSuggestions();dom.search.blur()}if(e.key==='Enter'&&state.view==='map'){const found=searchRooms(dom.search.value);if(found.length){openRoom(found[0]);}}});
dom.clear.onclick=()=>{dom.search.value='';dom.clear.hidden=true;hideSuggestions();if(state.view==='list')renderOffers();dom.search.focus()};
document.addEventListener('pointerdown',e=>{if(!e.target.closest('#searchBox'))hideSuggestions()});
function renderOffers(){
 const groups={alle:'Alle Angebote',kinder:'Angebote für Kinder',eltern:'Gespräche und Informationen',offen:'Zur Ansicht geöffnete Räume',service:'Service'};
 const room=state.listRoom;
 $('roomFilter').hidden=!room;
 if(room)$('roomFilterText').textContent='Nur '+room.label+' · '+floorName(room.floor);
 const q=norm(dom.search.value);
 const matches=e=>{if(!q)return true;const r=e.room?getRoom(e.room):null;return norm([e.title,e.note,e.room||'',r?.label||'',r?.floor?floorName(r.floor):'',categories[e.category]||''].join(' ')).includes(q)};
 const filtered=data.events.filter(e=>(state.filter==='alle'||e.category===state.filter)&&(!room||e.room===room.id)&&matches(e));
 let html=`<h2>${room?'Angebote in '+escapeHTML(room.label):groups[state.filter]} <span style="font-weight:500;color:#7b8993;font-size:12px">(${filtered.length})</span></h2>`;
 if(!filtered.length)html+='<div class="no-results">Keine passenden Angebote gefunden. Versuche einen anderen Suchbegriff oder Filter.</div>';
 html+=filtered.map(e=>{const r=e.room?getRoom(e.room):null;const floor=r?data.floors.find(f=>f.id===r.floor):null;
 return `<button type="button" class="offer-card ${r?'':'disabled'}" ${r?`data-room="${escapeHTML(e.room)}"`:''}>
 <span class="room-number">${r?escapeHTML(r.label.replace('Raum ','')):'—'}</span>
 <span class="card-main"><strong>${escapeHTML(e.title)}</strong><small>${r?escapeHTML(floor.name+' · Karte anzeigen'):escapeHTML(e.note||'Standort noch zu ergänzen')}</small></span><span class="arrow">${r?'›':''}</span>
 </button>`}).join('');$('offers').innerHTML=html;
 $('offers').querySelectorAll('[data-room]').forEach(b=>b.onclick=()=>openRoom(getRoom(b.dataset.room)));
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.filter').forEach(x=>{const selected=x===b;x.classList.toggle('active',selected);x.setAttribute('aria-pressed',String(selected))});renderOffers();$('offers').scrollTop=0;});
// Die Bilder liegen als unveränderte Original-Assets im Projektordner. Keine Änderung der Quelle.
setMapSize();setFloor('eg');renderOffers();
const observer=new ResizeObserver(()=>{if(state.view==='map'&&!state.selected)fit();else if(state.view==='map'&&state.selected)focusRoom(state.selected)});observer.observe(dom.viewport);
})();
